run-title: llama-mob-top1-tuluv3-plus-experts-2

resume: False 
resume-path: ./ckpts
model: micro-llama
random-labels: False

dataset: tuluv3-plus-experts # {experts, tuluv3, medical-sft}
base-model: meta-llama/Llama-3.2-1B
tokenizer: meta-llama/Llama-3.2-1B-Instruct
num-experts: 4
top-k-experts: 1
jitter-noise: 0
router-aux-loss-coef: 0.001
use-load-balancing: False
use-router: True
mask-input: True
max-length: 4096
save-steps: 0.25

trainable:
  - model

num-epochs: 1
batch-size: 1
gradient-accumulation-steps: 8
learning-rate: 2.e-5
warmup-ratio: 0.03
lr-scheduler: cosine

save-path: ./ckpts